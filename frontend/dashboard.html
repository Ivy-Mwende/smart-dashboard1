<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Finance Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-page">
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">💰 Smart Finance Dashboard</h1>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
    </nav>

    <main class="dashboard-container">
        <!-- Summary Section -->
        <section class="summary-section">
            <div class="summary-card income-card">
                <div class="summary-label">Total Income</div>
                <div class="summary-amount" id="totalIncome">$0.00</div>
            </div>
            <div class="summary-card expenses-card">
                <div class="summary-label">Total Expenses</div>
                <div class="summary-amount" id="totalExpenses">$0.00</div>
            </div>
            <div class="summary-card balance-card">
                <div class="summary-label">Balance</div>
                <div class="summary-amount" id="balance">$0.00</div>
            </div>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="chart-container">
                <h2>Expense Distribution</h2>
                <canvas id="expenseChart"></canvas>
            </div>
            <div class="chart-container">
                <h2>Income vs Expenses</h2>
                <canvas id="summaryChart"></canvas>
            </div>
        </section>

        <!-- Add Transaction Section -->
        <section class="add-transaction-section">
            <div class="form-card">
                <h2>Add Income</h2>
                <form id="incomeForm" class="transaction-form">
                    <div class="form-group">
                        <label for="incomeSource">Source</label>
                        <input type="text" id="incomeSource" placeholder="e.g., Salary, Freelance" required>
                    </div>
                    <div class="form-group">
                        <label for="incomeAmount">Amount</label>
                        <input type="number" id="incomeAmount" placeholder="0.00" step="0.01" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Income</button>
                    <div id="incomeMessage" class="message"></div>
                </form>
            </div>

            <div class="form-card">
                <h2>Add Expense</h2>
                <form id="expenseForm" class="transaction-form">
                    <div class="form-group">
                        <label for="expenseName">Category</label>
                        <input type="text" id="expenseName" placeholder="e.g., Groceries, Rent" required>
                    </div>
                    <div class="form-group">
                        <label for="expenseAmount">Amount</label>
                        <input type="number" id="expenseAmount" placeholder="0.00" step="0.01" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Expense</button>
                    <div id="expenseMessage" class="message"></div>
                </form>
            </div>
        </section>

        <!-- Transactions Section -->
        <section class="transactions-section">
            <div class="transactions-container">
                <h2>Recent Income</h2>
                <div id="incomeList" class="transaction-list">
                    <p class="empty-message">No income entries yet</p>
                </div>
            </div>

            <div class="transactions-container">
                <h2>Recent Expenses</h2>
                <div id="expenseList" class="transaction-list">
                    <p class="empty-message">No expenses yet</p>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
