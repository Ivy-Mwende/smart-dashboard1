<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Dashboard</title>
    <link rel="stylesheet" href="style.css?v=20260724" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SmartPay</p>
          <h1>Welcome back</h1>
        </div>
        <button class="ghost-btn" id="logout-btn" type="button" hidden>Logout</button>
      </header>

      <section class="hero-card">
        <div>
          <p class="eyebrow">Secure • Smart • Fast</p>
          <h2>Manage your money from one calm dashboard.</h2>
        </div>
        <div class="hero-badge">Live insights</div>
      </section>

      <section class="auth-card" id="auth-section">
        <div class="card-head">
          <div>
            <h3>Secure access</h3>
            <p>Use your account to continue.</p>
          </div>
          <div class="tab-group" role="tablist" aria-label="Auth mode">
            <button class="tab-btn active" data-mode="login" type="button">Login</button>
            <button class="tab-btn" data-mode="register" type="button">Register</button>
          </div>
        </div>
        <form id="auth-form">
          <div class="field" id="name-field">
            <label for="name">Full name</label>
            <input id="name" placeholder="Your name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" />
            <p id="password-hint" class="hint"></p>
          </div>
          <button class="primary-btn" type="submit" id="auth-submit">Log in</button>
        </form>
        <button class="secondary-btn" id="google-auth" type="button">Continue with Google</button>
        <p id="auth-message" class="message" aria-live="polite"></p>
      </section>

      <section class="dashboard-section" id="dashboard-section" hidden>
        <div class="summary-card">
          <div>
            <p class="eyebrow">Balance</p>
            <h3 id="balance-value">$0.00</h3>
          </div>
          <div class="summary-pill" id="summary-pill">Ready</div>
        </div>

        <div class="action-grid">
          <button class="action-btn" type="button" data-action="pay">Pay</button>
          <button class="action-btn" type="button" data-action="send">Send</button>
          <button class="action-btn" type="button" data-action="save">Save</button>
          <button class="action-btn" type="button" data-action="insights">Insights</button>
        </div>

        <div class="dashboard-grid">
          <div class="panel">
            <h4>Accounts</h4>
            <ul id="accounts-list"></ul>
          </div>
          <div class="panel">
            <h4>Transactions</h4>
            <ul id="transactions-list"></ul>
          </div>
          <div class="panel">
            <h4>Insights</h4>
            <ul id="insights-list"></ul>
          </div>
          <div class="panel chart-panel">
            <canvas id="spending-chart"></canvas>
          </div>
        </div>
      </section>
    </div>

    <script src="app.js?v=20260724"></script>
  </body>
</html>
