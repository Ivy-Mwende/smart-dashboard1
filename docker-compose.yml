version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_finance_db
    environment:
      POSTGRES_USER: smartfinance
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: smart_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfinance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# To use this, install Docker and run:
# docker-compose up -d
# Then set DATABASE_URL=postgresql://smartfinance:secure_password_123@localhost:5432/smart_finance
